# The shared workflow runs the agent only for authors with write access or the pipeline's own App.
name: Issue Worker

on:
  issues:
    types: [opened]

concurrency:
  group: issue-worker-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  work:
    uses: JINGBANZ/workflows/.github/workflows/issue-worker.yml@main
    permissions:
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
