# The owner explicitly approves an issue by applying the `agent-ready` label. The pinned reusable
# workflow then independently verifies that the issue author has write access before running the
# write-capable agent.
name: Issue Worker

on:
  issues:
    types: [labeled]

concurrency:
  group: issue-worker-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  work:
    if: github.actor == github.repository_owner && github.event.label.name == 'agent-ready'
    uses: JINGBANZ/workflows/.github/workflows/issue-worker.yml@0576cdaa7c17a5125960b68918f7d1e9ab0e7619
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
    with:
      runs-on: ubuntu-latest
      # engine: claude           # optional (default: claude)
      # model: claude-sonnet-4-6 # optional (default: claude-opus-4-8)
