name: Release ready check — setup feasibility

on:
  push:
    branches: [feat/release-readiness]

permissions:
  contents: read

concurrency:
  group: release-setup-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the dedicated test credential
        env:
          RELEASE_READINESS_OPENAI_API_KEY: ${{ secrets.RELEASE_TEST_OPENAI_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os
          key = os.environ.get('RELEASE_READINESS_OPENAI_API_KEY', '')
          if not 20 <= len(key) <= 1024 or any(character.isspace() for character in key):
              raise SystemExit('A protected RELEASE_TEST_OPENAI_API_KEY secret is required')
          PYTHON
      - name: Verify the fixed public signed setup fixture
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .jarvis/release-ui-probe .build/setup-fixture
          curl --fail --location --retry 3 \
            https://github.com/JINGBANZ/jarvis/releases/download/v0.5.14/Jarvis.dmg \
            --output .build/setup-fixture/Jarvis.dmg
          printf '%s  %s\n' \
            eb2f8ebc0f78ff4d6b09773e9052652eae74ffcc9d4bebf885a8c62b9b38416c \
            .build/setup-fixture/Jarvis.dmg | shasum -a 256 -c -
          python3 -m venv "$RUNNER_TEMP/release-layout-venv"
          "$RUNNER_TEMP/release-layout-venv/bin/python" -m pip install \
            --require-hashes --requirement scripts/requirements-release.txt
          DMGBUILD_PYTHON="$RUNNER_TEMP/release-layout-venv/bin/python" \
            ./scripts/verify-release.sh .build/setup-fixture/Jarvis.dmg v0.5.14
          fixture_mount="$(mktemp -d "$RUNNER_TEMP/jarvis-setup.XXXXXX")"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then hdiutil detach "$fixture_mount" || exit 1; fi
            rmdir "$fixture_mount"
          }
          trap cleanup EXIT
          hdiutil attach .build/setup-fixture/Jarvis.dmg -readonly -nobrowse -mountpoint "$fixture_mount"
          mounted=true
          test ! -e "$RUNNER_TEMP/Jarvis-setup-fixture.app"
          ditto "$fixture_mount/Jarvis.app" "$RUNNER_TEMP/Jarvis-setup-fixture.app"
          codesign --verify --strict --deep "$RUNNER_TEMP/Jarvis-setup-fixture.app"
          python3 - <<'PYTHON'
          import json, os, platform
          from pathlib import Path
          Path('.jarvis/release-ui-probe/fixture.json').write_text(json.dumps({
              'phase': 'setup-feasibility', 'version': '0.5.14',
              'sha256': 'eb2f8ebc0f78ff4d6b09773e9052652eae74ffcc9d4bebf885a8c62b9b38416c',
              'architecture': platform.machine(), 'macOS': platform.mac_ver()[0],
              'runnerImage': os.environ.get('ImageOS'),
              'runnerImageVersion': os.environ.get('ImageVersion'),
              'releaseCandidateProven': False, 'upgradeProven': False,
          }, indent=2) + '\n')
          PYTHON
      - name: Inspect supported UI automation setup
        run: |
          sw_vers
          /usr/bin/automationmodetool
          /usr/bin/automationmodetool | grep -F 'DOES NOT REQUIRE'
      - name: Install the pinned virtual audio devices
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://existential.audio/downloads/BlackHole2ch-0.7.1.pkg \
            --output "$RUNNER_TEMP/BlackHole2ch.pkg"
          printf '%s  %s\n' \
            57b540f27a3e29c37e310e01bee0fdfab76733087e47f997ef9dccf851400dcf \
            "$RUNNER_TEMP/BlackHole2ch.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/BlackHole2ch.pkg" -target /
          curl --fail --location --retry 3 \
            https://existential.audio/downloads/BlackHole16ch-0.7.1.pkg \
            --output "$RUNNER_TEMP/BlackHole16ch.pkg"
          printf '%s  %s\n' \
            57254e2f76cd40db7f3f715238b1a2cb2bd08819d38abf4087f2944f71a3641a \
            "$RUNNER_TEMP/BlackHole16ch.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/BlackHole16ch.pkg" -target /
          sudo killall coreaudiod
          sleep 3
      - name: Prepare native permission authorization
        run: python3 scripts/prepare-release-ui-account.py prepare
      - name: Exercise the basic journey on the fixed public fixture
        env:
          RELEASE_READINESS_OPENAI_API_KEY: ${{ secrets.RELEASE_TEST_OPENAI_API_KEY }}
        run: python3 scripts/probe-release-ui.py --setup-candidate "$RUNNER_TEMP/Jarvis-setup-fixture.app"
      - name: Remove the temporary authorization account
        if: always()
        run: python3 scripts/prepare-release-ui-account.py cleanup
      - name: Retain only scalar setup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-setup-feasibility-${{ matrix.os }}
          path: |
            .jarvis/release-ui-probe/fixture.json
            .jarvis/release-ui-probe/*/setup-feasibility.json
            .jarvis/release-ui-probe/*/stage.json
            .jarvis/release-ui-probe/*/*/journey.json
            .jarvis/release-ui-probe/*/*/ui-stage.json
            .jarvis/release-ui-probe/*/*/ui-issue.json
            .jarvis/release-ui-probe/*/*/ui-failure.json
            .jarvis/release-ui-probe/*/*/ui-command.json
            .jarvis/release-ui-probe/*/*/ui-progress.json
            .jarvis/release-ui-probe/*/*/permission-state.json
            .jarvis/release-ui-probe/*/*/permission-completion.json
            .jarvis/release-ui-probe/*/*/permission-initial.json
            .jarvis/release-ui-probe/*/*/permission-discovery.json
            .jarvis/release-ui-probe/*/*/permission-owner.json
            .jarvis/release-ui-probe/*/*/permission-wait.json
            .jarvis/release-ui-probe/*/*/relaunch-control.json
            .jarvis/release-ui-probe/*/*/recording-final.json
            .jarvis/release-ui-probe/*/*/recording-initial.json
            .jarvis/release-ui-probe/*/*/authorization.json
            .jarvis/release-ui-probe/*/*/authorization-process.json
            .jarvis/release-ui-probe/*/*/authorization-owner.json
            .jarvis/release-ui-probe/*/*/authorization-username-owner.json
            .jarvis/release-ui-probe/*/*/cleanup.json
            .jarvis/release-ui-probe/*/*/summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
