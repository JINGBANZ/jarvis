name: Claude Code Review (fork)

# Fork pull requests cannot see repository secrets on `pull_request`, so claude-code-review.yml
# skips them by design and outside contributions land with no automated review. This caller
# restores that coverage using `pull_request_target`, which runs in the base repository's context
# and therefore holds CLAUDE_CODE_OAUTH_TOKEN.
#
# `pull_request_target` is the dangerous trigger in GitHub Actions, so the reasons this one is safe
# are recorded here and must stay true:
#
#   - The shared workflow's `actions/checkout` step passes no `ref:`. Under `pull_request_target`
#     that resolves to the *base* branch, so the runner only ever executes code already merged to
#     `main` — never the contributor's. The review reads the contributor's diff through the API
#     (`/code-review --comment <repo>/pull/<n>`), as data the model inspects rather than code the
#     runner runs.
#   - Permissions are read-only apart from `id-token: write`. The review's only write path is the
#     comment it posts, so a prompt injection planted in contributor code cannot push, merge, or
#     otherwise alter the repository.
#
# Never add a `ref:` or `repository:` checkout override, a build/install/codegen step, or
# `contents: write` to this caller. Any one of those hands an untrusted fork a secret-bearing
# runner, which is the vulnerability this shape exists to avoid.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  # Fork PRs only. Same-repo branches — including dependabot's and release-please's, which are
  # pushed into this repository rather than a fork — are already covered by claude-code-review.yml,
  # and running both would post two reviews on every internal pull request.
  review:
    if: github.event.pull_request.head.repo.full_name != github.repository
    uses: JINGBANZ/workflows/.github/workflows/claude-code-review.yml@main
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
