name: Release

on:
  push:
    branches: [main]

# A release runs to completion before the next one starts; never cancel a half-finished publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; each job widens only what it needs.
permissions: {}

jobs:
  # Runs on every push to main. Reads conventional commits and maintains the standing Release PR
  # (bumps the version in Resources/Info.plist + CHANGELOG). It does not execute repo code.
  # release_created flips true only on the push that merges the Release PR — that push creates
  # the tag and the GitHub Release, and gates the publish job below.
  #
  # Note: the Release PR is authored by GITHUB_TOKEN, whose PRs don't trigger ci.yml. If CI is
  # ever made a *required* check, the Release PR becomes unmergeable — switch to a GitHub App
  # token at that point (see the evolving repo's release.yml for the worked example).
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write # release-please labels the Release PR via the issues API
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build, sign, notarize, and attach Jarvis.dmg to the Release just created. Gate
  # (tests) and publish share one job — macOS minutes bill at 10x, and re-running the Swift build
  # in a second job would double the cost for no extra safety: any failing step here still aborts
  # before the upload. This deliberately lives in the same workflow rather than a tag-triggered
  # one: tags created with GITHUB_TOKEN never trigger other workflows.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # AppKit selects the macOS 26 control design from the linked SDK. Pin the release runner instead
    # of following macos-latest so distributed and local macOS 26 builds cannot silently diverge.
    runs-on: macos-26
    # Keep signing and notarization credentials unavailable until the owner approves the job.
    environment: release
    # Notarization occasionally stalls on Apple's side; without a cap, a stalled run rides the
    # 6-hour default timeout at the 10x macOS minute multiplier. Normal publishes finish well
    # under this. The cap must clear package-app.sh's two sequential
    # `notarytool --wait --timeout 30m` calls PLUS checkout/test/build/sign work — otherwise the job
    # could be killed during the outer-container wait, leaving a draft release without its asset.
    # 75m keeps the backstop while giving both submissions their full bounded windows.
    timeout-minutes: 75
    permissions:
      contents: write # upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository gate
        run: swift build && ./scripts/run-tests.sh

      # GitHub's documented recipe for signing on a hosted runner: decode the Developer ID
      # certificate into a fresh temporary keychain. set-key-partition-list is what lets codesign
      # use the key without a GUI prompt (which would hang forever headless); the keychain
      # password is throwaway, so it's generated here rather than stored as a secret.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build, sign, notarize, package
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$EXPECTED_RELEASE_TAG" ]]; then
            echo "error: release-please did not provide the expected release tag" >&2
            exit 1
          fi
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$NOTARY_KEY_PATH"
          export NOTARY_KEY_PATH
          ./scripts/package-app.sh

      # The Release is created as a draft (release-please-config.json), so a failed build/sign/
      # notarize/verify run never leaves a public Release without its app — publishing happens only
      # after the assets and user-facing install notes are ready. force-tag-creation makes
      # release-please create the git tag immediately (GitHub otherwise defers tagging drafts until
      # publish, and a lingering untagged draft would make later release-please runs miss the previous
      # release and garble changelogs).
      - name: Attach the app and publish the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ASSET="Jarvis.dmg"
          ASSET_LABEL="Jarvis for Apple silicon (macOS 14.2+)"
          if [[ ! -f "$ASSET" || -L "$ASSET" ]]; then
            echo "error: expected one regular $ASSET release artifact" >&2
            exit 1
          fi

          CURRENT_NOTES="$RUNNER_TEMP/current-release-notes.md"
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --json body --jq .body > "$CURRENT_NOTES"
          if grep -Fq '<!-- jarvis-release-install -->' "$CURRENT_NOTES"; then
            cp "$CURRENT_NOTES" "$RELEASE_NOTES"
          else
            INSTALL_HEADER="$RUNNER_TEMP/release-header.md"
            DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"
            sed "s|@JARVIS_DOWNLOAD_URL@|$DOWNLOAD_URL|g" \
              .github/release-header.md > "$INSTALL_HEADER"
            cat "$INSTALL_HEADER" "$CURRENT_NOTES" > "$RELEASE_NOTES"
          fi

          ASSET_NAMES="$RUNNER_TEMP/existing-release-assets.txt"
          ASSET_DIR="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$ASSET_DIR"
          RELEASE_IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$RELEASE_IS_DRAFT" != "true" && "$RELEASE_IS_DRAFT" != "false" ]]; then
            echo "error: couldn't determine whether release $TAG is a draft" >&2
            exit 1
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$ASSET_NAMES"
          UNEXPECTED_ASSETS="$(awk -v expected="$ASSET" '$0 != expected { print }' "$ASSET_NAMES")"
          if [[ -n "$UNEXPECTED_ASSETS" ]]; then
            echo "error: refusing to publish with unexpected app assets:" >&2
            printf '%s\n' "$UNEXPECTED_ASSETS" >&2
            exit 1
          fi
          # A retry may encounter either a partial draft or a public Release whose publish response
          # was lost. Draft assets are safe to replace; public assets must never be deleted here.
          for asset in "$ASSET"; do
            if grep -Fxq "$asset" "$ASSET_NAMES"; then
              gh release download "$TAG" --pattern "$asset" --dir "$ASSET_DIR"
              if cmp -s "$asset" "$ASSET_DIR/$asset"; then
                echo "existing release asset is identical: $asset"
              elif [[ "$RELEASE_IS_DRAFT" == "true" ]]; then
                echo "replacing different draft release asset: $asset"
                gh release upload "$TAG" "$asset#$ASSET_LABEL" --clobber
              else
                echo "error: release already has a different $asset; preserving it" >&2
                exit 1
              fi
            else
              gh release upload "$TAG" "$asset#$ASSET_LABEL"
            fi
          done
          gh release edit "$TAG" --notes-file "$RELEASE_NOTES" --draft=false --latest

      # Hosted runners are ephemeral, but scrubbing the signing key is cheap insurance (and
      # required hygiene if this ever moves to a self-hosted runner).
      - name: Delete temporary keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
