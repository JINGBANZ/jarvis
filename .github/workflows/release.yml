name: Release

on:
  push:
    branches: [main]

# A release runs to completion before the next one starts; never cancel a half-finished publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; each job widens only what it needs.
permissions: {}

# The macOS build is done locally, not here. This repo is private, so macOS runner minutes are
# billed (at a 10x multiplier); rather than pay per release, the signing + notarization + upload
# runs on the maintainer's Mac via `scripts/package-app.sh` — the one machine that already holds
# the Developer ID certificate. This workflow keeps only the free-Linux bookkeeping: on the push
# that merges the Release PR, release-please bumps the version in Resources/Info.plist, writes the
# CHANGELOG, creates the git tag (force-tag-creation), and opens a *draft* GitHub Release. The
# maintainer then runs package-app.sh, uploads Jarvis-<version>.zip to that draft, and publishes
# it — see wiki/build-and-run.md → Distribution.
jobs:
  # Runs on every push to main. Reads conventional commits and maintains the standing Release PR
  # (bumps the version in Resources/Info.plist + CHANGELOG). It does not execute repo code.
  #
  # Note: the Release PR is authored by GITHUB_TOKEN, whose PRs don't trigger ci.yml. If CI is
  # ever made a *required* check, the Release PR becomes unmergeable — switch to a GitHub App
  # token at that point (see the evolving repo's release.yml for the worked example).
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write # release-please labels the Release PR via the issues API
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
