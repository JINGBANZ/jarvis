name: Release

on:
  push:
    branches: [main]

# A release runs to completion before the next one starts; never cancel a half-finished publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; each job widens only what it needs.
permissions: {}

jobs:
  # The Release PR is authored by GITHUB_TOKEN, so ci.yml never runs on it and the required `test`
  # check stays missing: an admin merges it with `gh pr merge <n> --squash --admin`.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write # release-please labels the Release PR via the issues API
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Same job as the Gate so the macOS build runs once, and same workflow because tags created with
  # GITHUB_TOKEN never trigger other workflows.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # Pinned, not macos-latest: AppKit picks the control design from the linked SDK.
    runs-on: macos-26
    # Merging the Release PR is the release approval, so this environment has no reviewer gate.
    environment: release
    # Must clear package-app.sh's two sequential 30-minute notarytool waits plus the build, or a
    # stalled notarization leaves a draft release without its asset.
    timeout-minutes: 75
    permissions:
      contents: write # upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository gate
        run: swift build && ./scripts/run-tests.sh

      - name: Install DMG layout tool
        run: |
          RELEASE_TOOLS="$RUNNER_TEMP/release-tools"
          python3 -m venv "$RELEASE_TOOLS"
          "$RELEASE_TOOLS/bin/python" -m pip install \
            --require-hashes \
            --requirement scripts/requirements-release.txt
          echo "DMGBUILD_PYTHON=$RELEASE_TOOLS/bin/python" >> "$GITHUB_ENV"

      # set-key-partition-list lets codesign use the key without a GUI prompt, which would hang headless.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build, sign, notarize, package
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$EXPECTED_RELEASE_TAG" ]]; then
            echo "error: release-please did not provide the expected release tag" >&2
            exit 1
          fi
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$NOTARY_KEY_PATH"
          export NOTARY_KEY_PATH
          ./scripts/package-app.sh

      # Signed after package-app.sh because stapling rewrites the disk image, and the EdDSA
      # signature must cover the exact bytes the release serves.
      - name: Sign the update and render the appcast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          NOTES_MD="$RUNNER_TEMP/appcast-notes.md"
          NOTES_HTML="$RUNNER_TEMP/appcast-notes.html"
          gh release view "$TAG" --json body --jq .body > "$NOTES_MD"
          if [[ -s "$NOTES_MD" ]]; then
            gh api --method POST /markdown -f mode=gfm -f text="$(cat "$NOTES_MD")" > "$NOTES_HTML"
            ./scripts/generate-appcast.sh Jarvis.dmg "$TAG" "$NOTES_HTML"
          else
            ./scripts/generate-appcast.sh Jarvis.dmg "$TAG"
          fi

      # release-please creates a draft, so a failed run never leaves a public Release without its app.
      - name: Attach the app and publish the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # macOS ships bash 3.2, which has no associative arrays.
          APP_ASSET="Jarvis.dmg"
          APPCAST_ASSET="appcast.xml"
          ASSETS=("$APP_ASSET" "$APPCAST_ASSET")
          asset_label() {
            case "$1" in
              "$APP_ASSET") echo "Jarvis for Apple silicon (macOS 14.2+)" ;;
              "$APPCAST_ASSET") echo "Sparkle update feed" ;;
              *) echo "error: no label for release asset $1" >&2; return 1 ;;
            esac
          }
          for asset in "${ASSETS[@]}"; do
            if [[ ! -f "$asset" || -L "$asset" ]]; then
              echo "error: expected one regular $asset release artifact" >&2
              exit 1
            fi
          done

          CURRENT_NOTES="$RUNNER_TEMP/current-release-notes.md"
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --json body --jq .body > "$CURRENT_NOTES"
          if grep -Fq '<!-- jarvis-release-install -->' "$CURRENT_NOTES"; then
            cp "$CURRENT_NOTES" "$RELEASE_NOTES"
          else
            INSTALL_HEADER="$RUNNER_TEMP/release-header.md"
            DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APP_ASSET}"
            sed "s|@JARVIS_DOWNLOAD_URL@|$DOWNLOAD_URL|g" \
              .github/release-header.md > "$INSTALL_HEADER"
            cat "$INSTALL_HEADER" "$CURRENT_NOTES" > "$RELEASE_NOTES"
          fi

          ASSET_NAMES="$RUNNER_TEMP/existing-release-assets.txt"
          ASSET_DIR="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$ASSET_DIR"
          RELEASE_IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$RELEASE_IS_DRAFT" != "true" && "$RELEASE_IS_DRAFT" != "false" ]]; then
            echo "error: couldn't determine whether release $TAG is a draft" >&2
            exit 1
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$ASSET_NAMES"
          EXPECTED_NAMES="$RUNNER_TEMP/expected-release-assets.txt"
          printf '%s\n' "${ASSETS[@]}" > "$EXPECTED_NAMES"
          UNEXPECTED_ASSETS="$(grep -Fxv -f "$EXPECTED_NAMES" "$ASSET_NAMES" || true)"
          if [[ -n "$UNEXPECTED_ASSETS" ]]; then
            echo "error: refusing to publish with unexpected app assets:" >&2
            printf '%s\n' "$UNEXPECTED_ASSETS" >&2
            exit 1
          fi
          # A retry may encounter either a partial draft or a public Release whose publish response
          # was lost. Draft assets are safe to replace; public assets must never be deleted here.
          for asset in "${ASSETS[@]}"; do
            LABEL="$(asset_label "$asset")"
            if grep -Fxq "$asset" "$ASSET_NAMES"; then
              gh release download "$TAG" --pattern "$asset" --dir "$ASSET_DIR"
              if cmp -s "$asset" "$ASSET_DIR/$asset"; then
                echo "existing release asset is identical: $asset"
              elif [[ "$RELEASE_IS_DRAFT" == "true" ]]; then
                echo "replacing different draft release asset: $asset"
                gh release upload "$TAG" "$asset#$LABEL" --clobber
              else
                echo "error: release already has a different $asset; preserving it" >&2
                exit 1
              fi
            else
              gh release upload "$TAG" "$asset#$LABEL"
            fi
          done
          gh release edit "$TAG" --notes-file "$RELEASE_NOTES" --draft=false --latest

      - name: Delete temporary keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
