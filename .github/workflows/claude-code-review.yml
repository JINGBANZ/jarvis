name: Claude Code Review

# Review logic lives in the pinned reusable workflow at JINGBANZ/workflows. Automatic reviews remain
# limited to branches in this repository; the reusable workflow defaults to `ubuntu-latest`.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    uses: JINGBANZ/workflows/.github/workflows/claude-code-review.yml@0576cdaa7c17a5125960b68918f7d1e9ab0e7619
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
