name: Claude Code Review

# Review logic follows the shared workflow's main branch. Automatic reviews remain limited to
# branches in this repository; the reusable workflow defaults to `ubuntu-latest`.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    uses: JINGBANZ/workflows/.github/workflows/claude-code-review.yml@main
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
