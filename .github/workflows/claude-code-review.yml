name: Claude Code Review

# Same-repo branches only. Never switch to `pull_request_target`: it would hand fork-authored input
# to a reviewer holding the App token, which `permissions:` does not bound. CodeRabbit reviews forks.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && !startsWith(github.head_ref, 'release-please--')
    uses: JINGBANZ/workflows/.github/workflows/claude-code-review.yml@main
    with:
      # Issue Worker opens PRs as this App; without it the action skips agent PRs.
      allowed-bots: jingbanz-agent
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
