# The scheduled/manual caller follows the shared workflow's main branch, whose runner default is
# `ubuntu-latest`. Its repository-scoped token lets a filed issue trigger Issue Worker.
name: Issue Opener

on:
  schedule:
    - cron: '7 19 * * *' # daily 03:07 Beijing (UTC+8); off-the-hour minute dodges peak cron delays
  workflow_dispatch: {} # manual runs; also re-enables the schedule after 60-day repo inactivity

jobs:
  open-issue:
    uses: JINGBANZ/workflows/.github/workflows/issue-opener.yml@main
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
