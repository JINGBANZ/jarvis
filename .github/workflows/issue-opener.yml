# Issues are filed with a GitHub App token, not GITHUB_TOKEN, so they trigger Issue Worker.
name: Issue Opener

on:
  schedule:
    - cron: '7 19 * * *' # 03:07 Beijing; off the hour to dodge peak cron delays
  workflow_dispatch: {} # also re-enables the schedule after 60 days of repo inactivity

jobs:
  open-issue:
    uses: JINGBANZ/workflows/.github/workflows/issue-opener.yml@main
    permissions:
      contents: read
      issues: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
