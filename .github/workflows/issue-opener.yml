# Runs only when the owner starts it from the Actions UI. Its central reusable workflow receives a
# repository-scoped token so it can file one proposed issue for later human approval.
name: Issue Opener

on:
  workflow_dispatch: {}

jobs:
  open-issue:
    uses: JINGBANZ/workflows/.github/workflows/issue-opener.yml@0576cdaa7c17a5125960b68918f7d1e9ab0e7619
    permissions:
      contents: read
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BOT_PAT: ${{ secrets.BOT_PAT }}
    with:
      runs-on: ubuntu-latest
      # engine: claude           # optional (default: claude)
      # model: claude-sonnet-4-6 # optional (default: claude-opus-4-8)
