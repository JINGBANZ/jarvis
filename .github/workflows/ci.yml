name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os == 'macos-15' && 'Compatibility' || 'Gate' }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    # Backstop: a hung run at the 6-hour default would burn about twice the monthly free tier.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        id: toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$(xcode-select -p)/../Info.plist"
          fingerprint="$( { xcodebuild -version; swift --version; } | shasum -a 256 | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
            .build/*-apple-macosx
            .build/build.db
            .build/debug.yaml
            .build/ci-cache-inputs.json
          key: swift-v1-${{ matrix.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/**') }}-${{ github.sha }}
          restore-keys: |
            swift-v1-${{ matrix.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/**') }}-

      - name: Restore unchanged input timestamps
        run: python3 scripts/ci-build-cache.py restore

      - name: Compile all targets
        run: swift build

      - name: Run tests
        run: |
          case "${{ matrix.os }}" in
            macos-15)
              ./scripts/run-ci-tests.sh --skip-shared-checks \
                --filter 'Jarvis(Overlay|Viewer|ScreenCapture|AEC)Tests'
              ;;
            macos-26-intel)
              ./scripts/run-ci-tests.sh --skip-shared-checks
              ;;
            *)
              ./scripts/run-ci-tests.sh
              ;;
          esac

      - name: Cache Intel subscription helper
        if: matrix.os == 'macos-26-intel'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/cliproxyapi/*/*/*/cliproxyapi
            .build/cliproxyapi/*/*/*/binary.sha256
            .build/cliproxyapi/*/*/*/LICENSE
          key: helper-native-v1-${{ runner.arch }}-${{ hashFiles('scripts/lib/cliproxyapi.sh', 'scripts/cliproxyapi/local-only.patch') }}

      - name: Check Intel helper egress
        if: matrix.os == 'macos-26-intel'
        run: ./scripts/test-proxy-privacy.sh

      - name: Record successful build inputs
        run: python3 scripts/ci-build-cache.py snapshot

      - name: Upload test failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failure-${{ matrix.os }}
          path: |
            .build/run-tests.log
            .build/test-ownership.json
            .build/test-diagnostics/
          include-hidden-files: true
          retention-days: 7

  # Keep the existing required check name while requiring all validation jobs to pass.
  test:
    needs: [gate, universal-app]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all validation jobs
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          UNIVERSAL_APP_RESULT: ${{ needs.universal-app.result }}
        run: |
          test "$GATE_RESULT" = success
          test "$UNIVERSAL_APP_RESULT" = success

  universal-app:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache bundled subscription helper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/cliproxyapi/*/*/*/cliproxyapi
            .build/cliproxyapi/*/*/*/binary.sha256
            .build/cliproxyapi/*/*/*/LICENSE
          key: helper-universal-v1-${{ hashFiles('scripts/lib/cliproxyapi.sh', 'scripts/cliproxyapi/local-only.patch') }}
      - name: Build and verify universal app without signing
        run: |
          swift build -c release --arch arm64 --arch x86_64
          ARTIFACTS="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          source scripts/lib/app-bundle.sh
          assemble_app .build/Jarvis.app "$ARTIFACTS" release
          ./scripts/check-universal-app.sh .build/Jarvis.app
          ./scripts/check-release-sdk.sh .build/Jarvis.app/Contents/MacOS/JarvisApp
      - name: Check bundled Apple silicon helper egress
        run: ./scripts/test-proxy-privacy.sh .build/Jarvis.app/Contents/MacOS/cliproxyapi
