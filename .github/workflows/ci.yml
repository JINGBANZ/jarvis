name: CI

# PR-only on purpose: release.yml re-runs the Gate on a release merge, and a push-to-main trigger
# would repeat this suite at the 10x macOS minute multiplier.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    # Backstop: a hung run at the 6-hour default would burn about twice the monthly free tier.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: swift --version

      - name: Compile all targets
        run: swift build

      - name: Run tests and static guards
        run: ./scripts/run-tests.sh
