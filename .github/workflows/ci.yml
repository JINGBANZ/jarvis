name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.build == 'universal' && 'universal-app' || format('{0} ({1})', matrix.os == 'macos-15' && 'Compatibility' || 'Gate', matrix.os) }}
    # GitHub can report matrix success when a job is cancelled before it gets a runner.
    outputs:
      compatibility: ${{ matrix.os == 'macos-15' && steps.validated.outputs.passed || '' }}
      apple-silicon: ${{ matrix.os == 'macos-26' && matrix.build == 'source' && steps.validated.outputs.passed || '' }}
      intel: ${{ matrix.os == 'macos-26-intel' && steps.validated.outputs.passed || '' }}
      universal: ${{ matrix.build == 'universal' && steps.validated.outputs.passed || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-26-intel]
        build: >-
          ${{ fromJSON((github.head_ref == 'release-please--branches--main' ||
          contains(github.event.pull_request.labels.*.name, 'autorelease: pending')) &&
          '["source"]' || '["source", "universal"]') }}
        exclude:
          - os: macos-15
            build: universal
          - os: macos-26-intel
            build: universal
    runs-on: ${{ matrix.os }}
    # Backstop: a hung run at the 6-hour default would burn about twice the monthly free tier.
    timeout-minutes: ${{ matrix.build == 'universal' && 25 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify source revision (${{ github.sha }})
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Compile ${{ matrix.build == 'universal' && 'unsigned universal app' || 'source and test targets' }}
        uses: ./.github/actions/ci-build
        with:
          runner-label: ${{ matrix.os }}
          configuration: ${{ matrix.build == 'universal' && 'universal' || 'debug' }}
          helper: ${{ matrix.build == 'universal' && 'universal' || matrix.os == 'macos-26-intel' && 'native' || '' }}

      - name: Run tests
        if: matrix.build == 'source'
        run: |
          case "${{ matrix.os }}" in
            macos-15)
              ./scripts/run-ci-tests.sh --skip-shared-checks \
                --filter 'Jarvis(Overlay|Viewer|ScreenCapture|AEC)Tests'
              ;;
            macos-26-intel)
              ./scripts/run-ci-tests.sh --skip-shared-checks
              ;;
            *)
              ./scripts/run-ci-tests.sh
              ;;
          esac

      - name: Check Intel helper egress
        if: matrix.os == 'macos-26-intel'
        run: ./scripts/test-proxy-privacy.sh

      - name: Assemble and verify unsigned universal app
        if: matrix.build == 'universal'
        run: |
          ARTIFACTS="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          source scripts/lib/app-bundle.sh
          assemble_app .build/Jarvis.app "$ARTIFACTS" release
          ./scripts/check-universal-app.sh .build/Jarvis.app
          ./scripts/check-release-sdk.sh .build/Jarvis.app/Contents/MacOS/JarvisApp

      - name: Check bundled Apple silicon helper egress
        if: matrix.build == 'universal'
        run: ./scripts/test-proxy-privacy.sh .build/Jarvis.app/Contents/MacOS/cliproxyapi

      - name: Upload test failure evidence
        if: failure() && matrix.build == 'source'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-failure-${{ matrix.os }}
          path: |
            .build/run-tests.log
            .build/test-ownership.json
            .build/test-diagnostics/
          include-hidden-files: true
          retention-days: 7

      - name: Record successful validation
        id: validated
        run: echo 'passed=true' >> "$GITHUB_OUTPUT"

  release-dispatch:
    needs: gate
    if: >-
      github.repository == 'JINGBANZ/jarvis' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 41898282 &&
      github.base_ref == 'main' && github.head_ref == 'release-please--branches--main' &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      worker_run: ${{ steps.dispatch.outputs.worker_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Start the main-branch readiness workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-promotion.py dispatch

  # Keep the existing required check name while requiring all validation jobs to pass.
  test:
    needs: [gate, release-dispatch]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: >-
      ${{ (github.head_ref == 'release-please--branches--main' || contains(github.event.pull_request.labels.*.name, 'autorelease: pending')) && 240 || 1 }}
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - name: Require all validation jobs
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          COMPATIBILITY_PASSED: ${{ needs.gate.outputs.compatibility }}
          APPLE_SILICON_PASSED: ${{ needs.gate.outputs.apple-silicon }}
          INTEL_PASSED: ${{ needs.gate.outputs.intel }}
          UNIVERSAL_PASSED: ${{ needs.gate.outputs.universal }}
          RELEASE_DISPATCH_RESULT: ${{ needs.release-dispatch.result }}
          RELEASE_SCOPE: >-
            ${{ github.head_ref == 'release-please--branches--main' || contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
        run: |
          test "$GATE_RESULT" = success
          if [[ "$COMPATIBILITY_PASSED" != true || "$APPLE_SILICON_PASSED" != true || "$INTEL_PASSED" != true ]]; then
            echo "error: one or more required source jobs did not complete successfully"
            exit 1
          fi
          if [[ "$RELEASE_SCOPE" == true ]]; then
            test "$RELEASE_DISPATCH_RESULT" = success
          elif [[ "$UNIVERSAL_PASSED" != true ]]; then
            echo "error: universal-app did not complete successfully"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: >-
          github.head_ref == 'release-please--branches--main' || contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Require acceptance from the dispatched release run
        if: >-
          github.head_ref == 'release-please--branches--main' || contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKER_RUN_ID: ${{ needs.release-dispatch.outputs.worker_run }}
        run: python3 scripts/release-promotion.py wait-ready
