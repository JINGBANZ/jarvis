# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Takes effect only from the default branch.
language: "en-US"

# Max 250 characters.
tone_instructions: >-
  Jarvis has strict audio, screen, credential, and ghost-mode boundaries — flag violations of them
  plainly. Do not propose speculative abstractions, extra lifecycle state, retries, or timers the
  change did not ask for.

reviews:
  # `assertive` buries the contract violations that matter under nitpicks.
  profile: chill

  auto_review:
    enabled: true
    drafts: false
    # No bot or title exclusion: `github-actions[bot]` also authors the shared-rules sync, which must
    # be reviewed, and a title filter would let a fork opt out of review.

  # Only inert generated output. Package.resolved and .release-please-manifest.json are build inputs.
  path_filters:
    - "!.build/**"
    - "!CHANGELOG.md"

  path_instructions:
    - path: "Sources/JarvisCore/**"
      instructions: >-
        Foundation-only by contract: flag AppKit and other OS-framework imports, which belong in
        JarvisApp, JarvisOverlay, JarvisScreenCapture, or JarvisBrainProviders. File and network
        APIs are NOT banned across Core — `Config`, `Benchmark`, and the non-kernel `Diagnostics`
        own real I/O by design, including the owner-only secrets file and the `.jarvis/` session
        directory. Route and scheduling policy must stay pure Foundation state machines; the app
        supplies clients, timers, and speech-activity events.
    - path: "Sources/JarvisCore/{Coach,Transcription,Triggers,Overlay,Audio,Support,Brain,Prompts,Screen,PrepMaterial}/**"
      instructions: >-
        Coaching kernel. Direct OS reach-through — FileManager, FileHandle, Process, URLSession,
        NSLog — belongs behind an injected port, never inline in coaching policy, and the kernel may
        not name the persistence or offline-analysis types (SessionStore, SessionAuditFileWriter,
        AgenticEvaluator and siblings); it emits through its narrow observer ports instead.
        Concrete provider adapters live in JarvisBrainProviders, outside this scope, and own their
        transports. `scripts/check-coaching-kernel.sh` is the enforcing guard and the authority on
        scope; report a disagreement with it as a finding about the guard, not about the code.
    - path: "Sources/{JarvisApp,JarvisOverlay,JarvisScreenCapture}/**"
      instructions: >-
        Ghost mode: during the live pipeline and teardown no autonomous path may activate Jarvis,
        present UI beyond the two nonactivating capture-excluded overlay panels, open apps or URLs,
        request attention, notify, or play sound. Every presentation API call needs an inline
        `ghost-mode-allowed` reason. Screen- and audio-derived data persists only in owner-only
        files under the workspace-local `.jarvis/` session directory, never `/tmp`, and raw
        microphone audio and the live transcript are never archived.
    - path: "**/*.swift"
      instructions: >-
        Swift 6 strict concurrency. Flag `@unchecked` or `nonisolated(unsafe)` used without a
        written reason. One primary type per file; focused extensions are named `Type+Purpose.swift`.
    - path: "Tests/**"
      instructions: >-
        swift-testing, not XCTest. A test must never be weakened, skipped, or deleted to make a
        change pass. Tests adapt to the code — do not ask for production seams added solely to make
        something testable.
    - path: ".github/workflows/**"
      instructions: >-
        Flag anything that exposes secrets to untrusted input: `pull_request_target` combined with a
        checkout of the pull request head, unpinned third-party actions, or `contents: write` where
        read would do. Third-party actions are SHA-pinned and Dependabot-managed.
